# Local dev: http://khayou.test -> Next.js dev server (npm run dev, port 3000).
# Also works with `npm run build && npm start`, which uses the same port.
#
# Enable (once):
#   sudo ln -s /mnt/data_project/nx-khayou-fe/nginx/khayou.test.conf /etc/nginx/sites-enabled/khayou.test
#   sudo nginx -t && sudo systemctl reload nginx
# Windows hosts file needs: 127.0.0.1  khayou.test

# Hot reload runs over a WebSocket (/_next/webpack-hmr), so pass Upgrade
# through. The map name is prefixed so it can't clash with other sites.
map $http_upgrade $khayou_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name khayou.test;

    access_log /var/log/nginx/khayou.test.access.log;
    error_log  /var/log/nginx/khayou.test.error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $khayou_connection_upgrade;

        # The first request to a page compiles it in dev, which can be slow.
        proxy_read_timeout 300s;
    }
}
